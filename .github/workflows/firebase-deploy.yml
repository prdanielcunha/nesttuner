name: NestTuner Firebase Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nesttuner-firebase-production
  cancel-in-progress: false

env:
  PROJECT_ID: millionsnest
  SITE: mn-nesttuner-555464791734
  DOMAIN: nesttuner.millionsnest.com
  LEGACY_PT_SITE: mn-nesttuner-pt-555464791734
  LEGACY_EN_SITE: mn-nesttuner-en-555464791734

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install and verify
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --non-interactive
          yarn run check

      - name: Preserve immutable embed releases
        run: node scripts/preserve-embed-releases.mjs "https://$SITE.web.app"

      - name: Authenticate with MillionsNest production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.25.1

      - name: Ensure official and redirect Hosting sites exist
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          SITES="$(curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "https://firebasehosting.googleapis.com/v1beta1/projects/$PROJECT_ID/sites")"
          for CURRENT_SITE in "$SITE" "$LEGACY_PT_SITE" "$LEGACY_EN_SITE"; do
            if ! echo "$SITES" | jq -e --arg site "projects/$PROJECT_ID/sites/$CURRENT_SITE" '.sites[]? | select(.name == $site)' >/dev/null; then
              curl -fsS -X POST                 -H "Authorization: Bearer $ACCESS_TOKEN"                 -H "Content-Type: application/json"                 -d '{}'                 "https://firebasehosting.googleapis.com/v1beta1/projects/$PROJECT_ID/sites?siteId=$CURRENT_SITE"
            fi
          done

      - name: Deploy canonical app and legacy redirects
        run: firebase deploy --project "$PROJECT_ID" --only "hosting:nesttuner,hosting:nesttuner-legacy-pt,hosting:nesttuner-legacy-en" --non-interactive

      - name: Ensure official custom-domain mapping
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          GET_URL="https://firebasehosting.googleapis.com/v1beta1/projects/$PROJECT_ID/sites/$SITE/customDomains/$DOMAIN"
          STATUS="$(curl -sS -o /tmp/domain.json -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "$GET_URL")"
          if [ "$STATUS" = "404" ]; then
            curl -fsS -X POST               -H "Authorization: Bearer $ACCESS_TOKEN"               -H "Content-Type: application/json"               -d '{"certPreference":"DEDICATED","annotations":{"product":"nesttuner","canonical":"true"}}'               "https://firebasehosting.googleapis.com/v1beta1/projects/$PROJECT_ID/sites/$SITE/customDomains?customDomainId=$DOMAIN" >/tmp/domain-operation.json
            sleep 8
          elif [ "$STATUS" != "200" ]; then
            cat /tmp/domain.json >&2
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "$GET_URL" >/tmp/nesttuner-domain.json || true

      - name: Smoke test canonical localized routes and immutable embeds
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://$SITE.web.app"
          VERSION="$(node -p "require('./package.json').version")"

          EMBED_STATUS="$(curl --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors -o /tmp/embed.js -w '%{http_code}' "$BASE/embed/nesttuner-element.v$VERSION.js")"
          test "$EMBED_STATUS" = '200'
          grep -Fq 'nest-tuner' /tmp/embed.js

          curl --silent --show-error --fail --retry 8 --retry-delay 2 --retry-all-errors "$BASE/embed/releases.json" -o /tmp/releases.json
          jq -e --arg version "$VERSION" '.releases[] | select(.version == $version)' /tmp/releases.json >/dev/null
          jq -e '.releases[] | select(.version == "0.4.0-beta.0")' /tmp/releases.json >/dev/null

          while IFS= read -r FILE; do
            curl --silent --show-error --fail --retry 8 --retry-delay 2 --retry-all-errors "$BASE/$FILE" -o /dev/null
          done < <(jq -r '.releases[].files[]' /tmp/releases.json)

          for PATHNAME in "/pt/" "/en/" "/es/"; do
            STATUS="$(curl --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors -o /tmp/site.html -w '%{http_code}' "$BASE$PATHNAME")"
            test "$STATUS" = '200'
            grep -Eiq '<!doctype html|<html' /tmp/site.html
            grep -Fq 'NestTuner' /tmp/site.html
          done

      - name: Smoke test legacy redirects
        shell: bash
        run: |
          set -euo pipefail
          PT_LOCATION="$(curl --silent --show-error --head "https://$LEGACY_PT_SITE.web.app/" | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}' | tail -n1)"
          EN_LOCATION="$(curl --silent --show-error --head "https://$LEGACY_EN_SITE.web.app/" | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}' | tail -n1)"
          test "$PT_LOCATION" = "https://nesttuner.millionsnest.com/pt/"
          test "$EN_LOCATION" = "https://nesttuner.millionsnest.com/en/"

      - name: Publish deployment evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## NestTuner Firebase deploy'
            echo
            echo "**SHA:** $GITHUB_SHA"
            echo "**Canonical Hosting:** https://$SITE.web.app"
            echo "**Official domain:** https://$DOMAIN"
            echo "**PT:** https://$DOMAIN/pt/"
            echo "**EN:** https://$DOMAIN/en/"
            echo "**ES:** https://$DOMAIN/es/"
            if [ -f /tmp/nesttuner-domain.json ]; then
              echo
              echo '### Domain state'
              jq '{name, hostState, ownershipState, requiredDnsUpdates, issues}' /tmp/nesttuner-domain.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
