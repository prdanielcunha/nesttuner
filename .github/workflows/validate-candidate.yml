# Temporary bootstrap validator for PR #1; remove after merge.
name: Validate NestTuner Candidate

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ec19875c1227b643ddcac4d6053b0784ca0cc5c5
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install
        run: yarn install --non-interactive
      - name: Validate
        run: yarn run check
