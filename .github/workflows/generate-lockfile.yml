name: Generate NestTuner Lockfile

on:
  push:
    branches: [chore/reproducible-builds]
    paths:
      - ".github/workflows/generate-lockfile.yml"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: nesttuner-lockfile
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lockfile branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: chore/reproducible-builds
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Resolve exact dependency graph
        run: yarn install --non-interactive

      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- yarn.lock && git ls-files --error-unmatch yarn.lock >/dev/null 2>&1; then
            echo "LOCKFILE_ALREADY_CURRENT=true"
            exit 0
          fi
          git config user.name "NestTuner CI"
          git config user.email "actions@users.noreply.github.com"
          git add yarn.lock
          git commit -m "chore: lock NestTuner dependency graph"
          git push origin HEAD:chore/reproducible-builds
